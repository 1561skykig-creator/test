<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Daily Tracker</title>
  
  <!-- PWA 앱 환경 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VibeTracker">
  <meta name="theme-color" content="#f8fafc">
  
  <!-- Inline Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json;utf8,{"name":"Vibe Daily Tracker","short_name":"VibeTracker","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#f8fafc","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3652/3652191.png","sizes":"512x512","type":"image/png"}]}'>
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel JS Preprocessor CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #f1f5f9;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes float-pastel-1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.75; }
      50% { transform: translate(-15px, -25px) scale(1.12); opacity: 0.95; }
    }

    @keyframes float-pastel-2 {
      0%, 100% { transform: translate(0px, 0px) scale(1.05); opacity: 0.7; }
      50% { transform: translate(20px, 15px) scale(0.95); opacity: 0.9; }
    }

    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .animate-spin-slow {
      animation: spin-slow 50s linear infinite;
    }

    .pastel-aura-1 {
      animation: float-pastel-1 10s ease-in-out infinite;
    }
    .pastel-aura-2 {
      animation: float-pastel-2 14s ease-in-out infinite 2s;
    }
    .pastel-pulse {
      animation: pulse-soft 6s ease-in-out infinite;
    }

    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-pink-300 selection:text-slate-900">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SVG 아이콘 컴포넌트 ---
    const IconPill = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>
      </svg>
    );

    const IconBook = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const IconPen = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.5 7.5"/><path d="m11 11 1 1"/>
      </svg>
    );

    const IconDumbbell = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/>
      </svg>
    );

    const IconCalendar = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>
      </svg>
    );

    const IconList = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
      </svg>
    );

    const IconYoutube = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.56 49.56 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><polygon points="10 15 15 12 10 9 10 15"/>
      </svg>
    );

    const IconLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconPlus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
    const IconCloudSync = ({ syncing }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={syncing ? "animate-spin text-pink-500" : "text-emerald-500"}>
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M12 13v-3"/><path d="m9 12 3-3 3 3"/>
      </svg>
    );

    const formatDate = (date) => {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };

    const MOODS = [
      { emoji: '😡', label: '화남' },
      { emoji: '🙁', label: '우울' },
      { emoji: '😐', label: '보통' },
      { emoji: '🙂', label: '좋음' },
      { emoji: '🥰', label: '최고' }
    ];

    const defaultDayData = {
      mood: null,
      health: { supplements: false, bpMeds: false, others: false, othersNote: '' },
      study: [],
      reading: [],
      exercise: [],
      review: { today: '', tomorrow: '' },
      other: [],
      youtube: []
    };

    const HealthView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || { supplements: false, bpMeds: false, others: false, othersNote: '' });
      const toggle = (field) => setData(prev => ({ ...prev, [field]: !prev[field] }));
      
      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-pink-100 group-hover:bg-pink-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
              <span className="p-2 rounded-xl bg-rose-100 text-rose-500"><IconPill size={20} /></span>
              건강 관리 체크리스트
            </h2>
            <div className="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-lg shadow-rose-100/50 border border-rose-100/80 space-y-3">
              <div onClick={() => toggle('supplements')} className="flex items-center justify-between p-4 bg-rose-50/50 rounded-2xl cursor-pointer hover:bg-rose-50 transition-colors border border-rose-100">
                <span className="font-semibold text-slate-700">💊 영양제 복용</span>
                <span className={`text-xl font-bold ${data.supplements ? 'text-rose-500' : 'text-slate-300'}`}>{data.supplements ? '✓' : '○'}</span>
              </div>
              <div onClick={() => toggle('bpMeds')} className="flex items-center justify-between p-4 bg-rose-50/50 rounded-2xl cursor-pointer hover:bg-rose-50 transition-colors border border-rose-100">
                <span className="font-semibold text-slate-700">🩸 혈압약 복용</span>
                <span className={`text-xl font-bold ${data.bpMeds ? 'text-rose-500' : 'text-slate-300'}`}>{data.bpMeds ? '✓' : '○'}</span>
              </div>
              <div onClick={() => toggle('others')} className="flex items-center justify-between p-4 bg-rose-50/50 rounded-2xl cursor-pointer hover:bg-rose-50 transition-colors border border-rose-100">
                <span className="font-semibold text-slate-700">🏥 기타 건강 관리</span>
                <span className={`text-xl font-bold ${data.others ? 'text-rose-500' : 'text-slate-300'}`}>{data.others ? '✓' : '○'}</span>
              </div>
              {data.others && (
                <input type="text" placeholder="기타 체크사항 메모" value={data.othersNote || ''} onChange={(e) => setData({ ...data, othersNote: e.target.value })} className="w-full bg-slate-50 text-slate-800 rounded-xl p-3 text-sm outline-none border border-rose-200 focus:ring-2 focus:ring-rose-300 mt-2" />
              )}
            </div>
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-2xl font-bold shadow-lg shadow-rose-200 hover:shadow-rose-300 active:scale-95 transition-all mt-4 border border-rose-300/50">
            저장하기
          </button>
        </div>
      );
    };

    const StudyView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || []);
      const addStudy = () => setData(prev => [...prev, { title: '', time: '', note: '' }]);
      const updateStudy = (index, field, value) => {
        const newData = [...data];
        newData[index][field] = value;
        setData(newData);
      };
      const removeStudy = (index) => setData(prev => prev.filter((_, i) => i !== index));

      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-indigo-100 group-hover:bg-indigo-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span className="p-2 rounded-xl bg-indigo-100 text-indigo-500"><IconBook size={20} /></span>
                학습 기록 ({data.length}/3)
              </h2>
              {data.length < 3 && (
                <button onClick={addStudy} className="flex items-center gap-1 text-sm bg-indigo-50 text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-full font-medium hover:bg-indigo-100"><IconPlus /> 추가</button>
              )}
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400 font-medium">오늘의 학습을 추가해보세요!</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white/80 backdrop-blur-xl p-5 rounded-3xl shadow-lg shadow-indigo-100/50 border border-indigo-100/80 space-y-3 relative">
                <button onClick={() => removeStudy(i)} className="absolute top-4 right-4 text-slate-400 hover:text-rose-500"><IconTrash /></button>
                <input type="text" placeholder="학습 주제 (예: 바이브코딩 웹개발)" value={item.title} onChange={(e) => updateStudy(i, 'title', e.target.value)} className="w-full text-lg font-bold outline-none pr-8 bg-transparent text-slate-800 placeholder:text-slate-300" />
                <input type="text" placeholder="학습 시간 (예: 2시간)" value={item.time} onChange={(e) => updateStudy(i, 'time', e.target.value)} className="w-full text-sm text-indigo-600 bg-indigo-50/60 p-2.5 rounded-xl outline-none border border-indigo-100" />
                <textarea placeholder="핵심 내용이나 메모" value={item.note} onChange={(e) => updateStudy(i, 'note', e.target.value)} className="w-full bg-slate-50 text-slate-700 rounded-xl p-3 text-sm min-h-[80px] outline-none border border-slate-200/80 resize-none focus:bg-white focus:border-indigo-300 transition-colors" />
              </div>
            ))}
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-indigo-400 to-blue-500 text-white rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:shadow-indigo-300 active:scale-95 transition-all mt-4 border border-indigo-300/50">
            저장하기
          </button>
        </div>
      );
    };

    const ReadingView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || []);
      const addReading = () => setData(prev => [...prev, { title: '', author: '', pages: '', quote: '', reflection: '' }]);
      const updateReading = (index, field, value) => {
        const newData = [...data];
        newData[index][field] = value;
        setData(newData);
      };
      const removeReading = (index) => setData(prev => prev.filter((_, i) => i !== index));

      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-emerald-100 group-hover:bg-emerald-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span className="p-2 rounded-xl bg-emerald-100 text-emerald-500"><IconPen size={20} /></span>
                독서 노트 ({data.length}/3)
              </h2>
              {data.length < 3 && (
                <button onClick={addReading} className="flex items-center gap-1 text-sm bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-full font-medium hover:bg-emerald-100"><IconPlus /> 책 추가</button>
              )}
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400 font-medium">오늘 읽은 책을 기록해보세요!</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-lg shadow-emerald-100/50 border border-emerald-100/80 space-y-3 relative">
                <button onClick={() => removeReading(i)} className="absolute top-5 right-5 text-slate-400 hover:text-rose-500"><IconTrash /></button>
                <input type="text" placeholder="책 제목" value={item.title} onChange={(e) => updateReading(i, 'title', e.target.value)} className="w-full font-bold text-lg outline-none pr-8 bg-transparent text-slate-800 placeholder:text-slate-300" />
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="저자" value={item.author} onChange={(e) => updateReading(i, 'author', e.target.value)} className="text-sm bg-slate-50 text-slate-700 p-2.5 rounded-xl outline-none border border-slate-200" />
                  <input type="text" placeholder="페이지 (p.10~35)" value={item.pages} onChange={(e) => updateReading(i, 'pages', e.target.value)} className="text-sm bg-slate-50 text-slate-700 p-2.5 rounded-xl outline-none border border-slate-200" />
                </div>
                <textarea placeholder="❝ 인상 깊었던 구절 ❞" value={item.quote} onChange={(e) => updateReading(i, 'quote', e.target.value)} className="w-full bg-emerald-50/70 border border-emerald-200 text-emerald-800 rounded-xl p-3 text-sm min-h-[70px] outline-none italic resize-none placeholder:text-emerald-300" />
                <textarea placeholder="나의 생각과 느낀 점" value={item.reflection} onChange={(e) => updateReading(i, 'reflection', e.target.value)} className="w-full bg-slate-50 text-slate-700 rounded-xl p-3 text-sm min-h-[80px] outline-none border border-slate-200 resize-none focus:bg-white focus:border-emerald-300 transition-colors" />
              </div>
            ))}
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-teal-400 to-emerald-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200 hover:shadow-emerald-300 active:scale-95 transition-all mt-4 border border-emerald-300/50">
            저장하기
          </button>
        </div>
      );
    };

    const ExerciseView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || []);
      const exerciseTypes = ['헬스', '등산', '러닝', '자전거', '기타'];
      const addExercise = () => setData(prev => [...prev, { type: '헬스', duration: '', note: '' }]);
      const updateExercise = (index, field, value) => {
        const newData = [...data];
        newData[index][field] = value;
        setData(newData);
      };
      const removeExercise = (index) => setData(prev => prev.filter((_, i) => i !== index));

      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-orange-100 group-hover:bg-orange-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span className="p-2 rounded-xl bg-orange-100 text-orange-500"><IconDumbbell size={20} /></span>
                운동 기록
              </h2>
              <button onClick={addExercise} className="flex items-center gap-1 text-sm bg-orange-50 text-orange-600 border border-orange-200 px-3 py-1.5 rounded-full font-medium hover:bg-orange-100"><IconPlus /> 추가</button>
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400 font-medium">오늘 어떤 운동을 하셨나요?</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white/80 backdrop-blur-xl p-5 rounded-3xl shadow-lg shadow-orange-100/50 border border-orange-100/80 space-y-3">
                <div className="flex justify-between items-center">
                  <div className="flex flex-wrap gap-1.5">
                    {exerciseTypes.map(type => (
                      <button key={type} onClick={() => updateExercise(i, 'type', type)} className={`px-2.5 py-1 text-xs rounded-full transition-all ${item.type === type ? 'bg-orange-400 text-white font-medium shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                        {type}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => removeExercise(i)} className="text-slate-400 hover:text-rose-500"><IconTrash /></button>
                </div>
                <div className="flex gap-2">
                  <input type="text" placeholder="시간 (예: 1시간)" value={item.duration} onChange={(e) => updateExercise(i, 'duration', e.target.value)} className="w-1/3 bg-slate-50 text-slate-800 rounded-xl p-2.5 text-sm outline-none border border-slate-200" />
                  <input type="text" placeholder="상세 내용" value={item.note} onChange={(e) => updateExercise(i, 'note', e.target.value)} className="w-2/3 bg-slate-50 text-slate-800 rounded-xl p-2.5 text-sm outline-none border border-slate-200" />
                </div>
              </div>
            ))}
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-amber-400 to-orange-500 text-white rounded-2xl font-bold shadow-lg shadow-orange-200 hover:shadow-orange-300 active:scale-95 transition-all mt-4 border border-orange-300/50">
            저장하기
          </button>
        </div>
      );
    };

    const ReviewView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || { today: '', tomorrow: '' });
      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-purple-100 group-hover:bg-purple-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
              <span className="p-2 rounded-xl bg-purple-100 text-purple-500"><IconCalendar size={20} /></span>
              하루 정리 및 계획
            </h2>
            <div className="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-lg shadow-purple-100/50 border border-purple-100/80 space-y-2">
              <label className="font-semibold text-slate-700">🌙 오늘 하루 돌아보기</label>
              <textarea placeholder="오늘 하루 감사했던 일이나 아쉬웠던 점" value={data.today} onChange={(e) => setData({ ...data, today: e.target.value })} className="w-full bg-slate-50 text-slate-800 rounded-2xl p-3.5 min-h-[120px] outline-none text-sm border border-slate-200 focus:border-purple-400 focus:bg-white transition-colors resize-none" />
            </div>
            <div className="bg-white/80 backdrop-blur-xl p-6 rounded-3xl shadow-lg shadow-purple-100/50 border border-purple-100/80 space-y-2">
              <label className="font-semibold text-slate-700">☀️ 내일의 핵심 계획</label>
              <textarea placeholder="내일 해야 할 핵심 목표" value={data.tomorrow} onChange={(e) => setData({ ...data, tomorrow: e.target.value })} className="w-full bg-slate-50 text-slate-800 rounded-2xl p-3.5 min-h-[100px] outline-none text-sm border border-slate-200 focus:border-purple-400 focus:bg-white transition-colors resize-none" />
            </div>
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-purple-400 to-indigo-500 text-white rounded-2xl font-bold shadow-lg shadow-purple-200 hover:shadow-purple-300 active:scale-95 transition-all mt-4 border border-purple-300/50">
            저장하기
          </button>
        </div>
      );
    };

    const OtherView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || []);
      const activityTags = ['청소', '세탁', '장보기', '외부 활동', '가족모임', '기타'];
      const addActivity = (type) => setData(prev => [...prev, { type, note: '' }]);
      const removeActivity = (index) => setData(prev => prev.filter((_, i) => i !== index));

      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-teal-100 group-hover:bg-teal-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <h2 className="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">
              <span className="p-2 rounded-xl bg-teal-100 text-teal-500"><IconList size={20} /></span>
              기타 활동
            </h2>
            <div className="flex flex-wrap gap-2 mb-4">
              {activityTags.map(tag => (
                <button key={tag} onClick={() => addActivity(tag)} className="px-3.5 py-1.5 bg-white border border-teal-200/80 text-teal-600 rounded-full text-xs font-semibold hover:bg-teal-50 shadow-sm transition-all">
                  + {tag}
                </button>
              ))}
            </div>
            <div className="space-y-2">
              {data.length === 0 && <div className="text-center py-8 text-slate-400 font-medium border-2 border-dashed border-slate-200 rounded-3xl">추가된 활동이 없습니다.</div>}
              {data.map((item, i) => (
                <div key={i} className="flex items-center gap-2 bg-white/80 backdrop-blur-xl p-3 rounded-2xl border border-teal-100 shadow-sm">
                  <span className="font-bold text-teal-600 text-sm whitespace-nowrap">{item.type}</span>
                  <input type="text" placeholder="세부 내용 (선택)" value={item.note} onChange={(e) => {
                    const newData = [...data];
                    newData[i].note = e.target.value;
                    setData(newData);
                  }} className="flex-1 bg-transparent outline-none text-sm text-slate-800 placeholder:text-slate-300" />
                  <button onClick={() => removeActivity(i)} className="text-slate-400 hover:text-rose-500"><IconTrash /></button>
                </div>
              ))}
            </div>
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 text-white rounded-2xl font-bold shadow-lg shadow-teal-200 hover:shadow-teal-300 active:scale-95 transition-all mt-4 border border-teal-300/50">
            저장하기
          </button>
        </div>
      );
    };

    const YoutubeView = ({ initialData, onSave, onBack }) => {
      const [data, setData] = useState(initialData || []);
      const addYoutube = () => setData(prev => [...prev, { channel: '', title: '', note: '' }]);
      const removeYoutube = (index) => setData(prev => prev.filter((_, i) => i !== index));

      return (
        <div className="flex flex-col h-full space-y-6">
          <button onClick={onBack} className="self-start flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition-colors group">
            <div className="p-1.5 rounded-full bg-white shadow-sm border border-rose-100 group-hover:bg-rose-50 transition-colors"><IconLeft /></div>
            뒤로가기
          </button>
          <div className="flex-1 space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span className="p-2 rounded-xl bg-rose-100 text-rose-500"><IconYoutube size={20} /></span>
                유튜브 시청 기록
              </h2>
              <button onClick={addYoutube} className="flex items-center gap-1 text-sm bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-full font-medium hover:bg-rose-100"><IconPlus /> 추가</button>
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400 font-medium">인상 깊었던 영상을 기록해보세요!</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white/80 backdrop-blur-xl p-5 rounded-3xl shadow-lg shadow-rose-100/50 border border-rose-100/80 space-y-2.5 relative">
                <button onClick={() => removeYoutube(i)} className="absolute top-4 right-4 text-slate-400 hover:text-rose-500"><IconTrash /></button>
                <input type="text" placeholder="채널명" value={item.channel} onChange={(e) => {
                  const newData = [...data];
                  newData[i].channel = e.target.value;
                  setData(newData);
                }} className="w-full text-xs font-semibold text-rose-500 bg-rose-50/70 p-2 rounded-lg outline-none pr-8 border border-rose-100" />
                <input type="text" placeholder="영상 제목" value={item.title} onChange={(e) => {
                  const newData = [...data];
                  newData[i].title = e.target.value;
                  setData(newData);
                }} className="w-full text-base font-bold outline-none bg-transparent text-slate-800 placeholder:text-slate-300" />
                <textarea placeholder="요약 및 느낀 점" value={item.note} onChange={(e) => {
                  const newData = [...data];
                  newData[i].note = e.target.value;
                  setData(newData);
                }} className="w-full bg-slate-50 text-slate-700 rounded-xl p-2.5 text-sm min-h-[70px] outline-none border border-slate-200 resize-none focus:bg-white focus:border-rose-300 transition-colors" />
              </div>
            ))}
          </div>
          <button onClick={() => onSave(data)} className="w-full py-4 bg-gradient-to-r from-pink-400 to-rose-500 text-white rounded-2xl font-bold shadow-lg shadow-rose-200 hover:shadow-rose-300 active:scale-95 transition-all mt-4 border border-rose-300/50">
            저장하기
          </button>
        </div>
      );
    };

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [records, setRecords] = useState({});
      const [currentView, setCurrentView] = useState('main');
      const [dbStatus, setDbStatus] = useState('connecting');
      const [dbRef, setDbRef] = useState({ db: null, doc: null, setDoc: null, onSnapshot: null, appId: 'default-app' });

      const dateKey = formatDate(currentDate);
      const todayData = records[dateKey] || defaultDayData;

      useEffect(() => {
        let unsubscribe = null;

        async function initFirebase() {
          try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'vibe-daily-tracker-default';
            const firebaseConfig = typeof __firebase_config !== 'undefined' 
              ? JSON.parse(__firebase_config) 
              : {
                  apiKey: "demo-key",
                  authDomain: "demo.firebaseapp.com",
                  projectId: "demo-project",
                  storageBucket: "demo.appspot.com",
                  messagingSenderId: "123456789",
                  appId: "1:123456789:web:123456"
                };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            setDbRef({ db, doc, setDoc, onSnapshot, appId });

            const docPath = doc(db, 'artifacts', appId, 'public', 'data', 'tracker_records', dateKey);
            
            unsubscribe = onSnapshot(docPath, (docSnap) => {
              if (docSnap.exists()) {
                setRecords(prev => ({
                  ...prev,
                  [dateKey]: docSnap.data()
                }));
              }
              setDbStatus('synced');
            }, (error) => {
              setDbStatus('synced');
            });

          } catch (err) {
            setDbStatus('synced');
          }
        }

        initFirebase();

        return () => {
          if (unsubscribe) unsubscribe();
        };
      }, [dateKey]);

      const updateCategoryData = async (category, data) => {
        const newDayData = {
          ...(records[dateKey] || defaultDayData),
          [category]: data
        };

        setRecords(prev => ({
          ...prev,
          [dateKey]: newDayData
        }));

        if (dbRef.db && dbRef.doc && dbRef.setDoc) {
          try {
            setDbStatus('saving');
            const targetDoc = dbRef.doc(dbRef.db, 'artifacts', dbRef.appId, 'public', 'data', 'tracker_records', dateKey);
            await dbRef.setDoc(targetDoc, newDayData, { merge: true });
            setDbStatus('synced');
          } catch (err) {
            setDbStatus('synced');
          }
        }
      };

      const changeDate = (days) => {
        const newDate = new Date(currentDate);
        newDate.setDate(newDate.getDate() + days);
        setCurrentDate(newDate);
        setCurrentView('main');
      };

      const displayDate = new Intl.DateTimeFormat('ko-KR', { 
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' 
      }).format(currentDate);

      /* 화사하고 조화로운 파스텔컬러 테마 폴더 구성 */
      const folders = [
        { id: 'health', title: '건강 관리', icon: IconPill, color: 'bg-gradient-to-tr from-rose-400 to-pink-400 text-white', shadow: 'shadow-pink-200/80 border-rose-200/50' },
        { id: 'study', title: '학습 기록', icon: IconBook, color: 'bg-gradient-to-tr from-indigo-400 to-blue-400 text-white', shadow: 'shadow-indigo-200/80 border-indigo-200/50' },
        { id: 'reading', title: '독서 활동', icon: IconPen, color: 'bg-gradient-to-tr from-emerald-400 to-teal-400 text-white', shadow: 'shadow-emerald-200/80 border-emerald-200/50' },
        { id: 'exercise', title: '운동 기록', icon: IconDumbbell, color: 'bg-gradient-to-tr from-amber-400 to-orange-400 text-white', shadow: 'shadow-orange-200/80 border-orange-200/50' },
        { id: 'review', title: '하루 정리', icon: IconCalendar, color: 'bg-gradient-to-tr from-purple-400 to-indigo-400 text-white', shadow: 'shadow-purple-200/80 border-purple-200/50' },
        { id: 'other', title: '기타 활동', icon: IconList, color: 'bg-gradient-to-tr from-teal-400 to-cyan-400 text-white', shadow: 'shadow-teal-200/80 border-teal-200/50' },
        { id: 'youtube', title: '유튜브 시청', icon: IconYoutube, color: 'bg-gradient-to-tr from-pink-400 to-rose-400 text-white', shadow: 'shadow-rose-200/80 border-rose-200/50' },
      ];

      const isFolderCompleted = (folderId) => {
        switch(folderId) {
          case 'health': return todayData.health?.supplements || todayData.health?.bpMeds || todayData.health?.others;
          case 'study': return todayData.study?.length > 0 && todayData.study.some(s => s.title);
          case 'reading': return todayData.reading?.length > 0 && todayData.reading.some(r => r.title);
          case 'exercise': return todayData.exercise?.length > 0 && todayData.exercise.some(e => e.type);
          case 'review': return Boolean(todayData.review?.today || todayData.review?.tomorrow);
          case 'other': return todayData.other?.length > 0;
          case 'youtube': return todayData.youtube?.length > 0 && todayData.youtube.some(y => y.title || y.channel);
          default: return false;
        }
      };

      const completedCount = folders.filter(f => isFolderCompleted(f.id)).length;

      const getGreeting = () => {
        const hour = currentDate.getHours();
        if (hour < 12) return '상쾌하고 포근한 아침이에요';
        if (hour < 18) return '따스하고 활기찬 오후입니다';
        return '편안하고 아름다운 저녁 되세요';
      };

      return (
        <div className="min-h-screen bg-slate-100 sm:flex sm:justify-center">
          {/* 전체 컨테이너: 밝은 백색~파스텔 그라데이션 바탕 */}
          <div className="w-full max-w-md bg-gradient-to-b from-slate-50 via-pink-50/20 to-purple-50/30 min-h-screen relative shadow-2xl sm:border-x border-slate-200 flex flex-col justify-between overflow-hidden">
            
            {/* 메인 화면 중심에서부터 넓게 퍼져나가는 부드러운 파스텔 오로라 광원 효과 */}
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[340px] h-[340px] bg-gradient-to-tr from-pink-200/60 via-purple-200/50 to-indigo-200/60 rounded-full blur-3xl pointer-events-none pastel-pulse" />
            <div className="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] bg-gradient-to-br from-amber-200/40 via-rose-200/50 to-sky-200/50 rounded-full blur-2xl pointer-events-none pastel-aura-1" />
            <div className="absolute bottom-1/4 right-2 w-64 h-64 bg-teal-200/35 rounded-full blur-3xl pointer-events-none pastel-aura-2" />

            {/* 상단 날짜 네비게이션 & DB 상태 */}
            <header className="sticky top-0 z-20 bg-white/70 backdrop-blur-md pt-6 pb-4 px-6 flex items-center justify-between border-b border-pink-100/60 shadow-xs">
              <button onClick={() => changeDate(-1)} className="p-2 rounded-full hover:bg-pink-50 text-slate-400 hover:text-slate-700 transition-colors">
                <IconLeft />
              </button>
              <div className="text-center">
                <div className="flex items-center justify-center gap-1.5">
                  <h1 className="text-base font-extrabold text-slate-800 tracking-tight">{displayDate}</h1>
                  <IconCloudSync syncing={dbStatus === 'saving'} />
                </div>
              </div>
              <button onClick={() => changeDate(1)} className="p-2 rounded-full hover:bg-pink-50 text-slate-400 hover:text-slate-700 transition-colors">
                <IconRight />
              </button>
            </header>

            <main className="px-6 py-4 flex-1 flex flex-col justify-between z-10 no-scrollbar overflow-y-auto">
              {currentView === 'main' ? (
                <div className="flex-1 flex flex-col justify-between py-2">
                  
                  {/* 상단 웰컴 바 (파스텔 뱃지) */}
                  <div className="text-center my-2">
                    <span className="text-xs font-bold tracking-wider text-purple-600 uppercase bg-white/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-purple-100 shadow-sm shadow-purple-100/50">
                      {getGreeting()} ✨
                    </span>
                  </div>

                  {/* 중앙 원형 오비탈 대시보드 (파스텔 방사형 레이아웃) */}
                  <div className="relative w-full aspect-square max-w-[320px] max-h-[320px] mx-auto my-auto flex items-center justify-center">
                    
                    {/* 은은한 회전 빛의 고리 */}
                    <div className="absolute w-[220px] h-[220px] rounded-full border border-dashed border-indigo-300/60 animate-spin-slow" />
                    <div className="absolute w-[260px] h-[260px] rounded-full border border-pink-200/50" />
                    <div className="absolute w-[300px] h-[300px] rounded-full border border-purple-100/60" />

                    {/* 중앙 대시보드 코어 (파스텔 글래스모피즘) */}
                    <div className="z-10 text-center flex flex-col items-center justify-center p-4 rounded-full bg-white/90 backdrop-blur-xl shadow-xl shadow-purple-200/60 border border-purple-100 w-32 h-32 hover:scale-105 transition-transform duration-300">
                      <span className="text-3xl font-black text-slate-800 tracking-tight">{completedCount}<span className="text-sm font-bold text-slate-400">/7</span></span>
                      <span className="text-[11px] font-bold text-indigo-500/80 mt-0.5">오늘의 기록</span>
                      <div className="w-12 h-1.5 bg-slate-100 rounded-full mt-1.5 overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 transition-all duration-500" style={{ width: `${(completedCount / 7) * 100}%` }} />
                      </div>
                    </div>

                    {/* 7개 파스텔 아이콘 버튼 원형 배치 */}
                    {folders.map((folder, index) => {
                      const IconComponent = folder.icon;
                      const total = folders.length;
                      const angle = (index * (360 / total) - 90) * (Math.PI / 180);
                      const radius = 120;
                      const x = Math.round(Math.cos(angle) * radius);
                      const y = Math.round(Math.sin(angle) * radius);
                      const completed = isFolderCompleted(folder.id);

                      return (
                        <button
                          key={folder.id}
                          onClick={() => setCurrentView(folder.id)}
                          style={{ transform: `translate(${x}px, ${y}px)` }}
                          className="absolute z-20 group flex flex-col items-center transition-all duration-300 hover:scale-110 active:scale-95"
                        >
                          <div className={`relative p-3 rounded-2xl ${completed ? folder.color : 'bg-white/90 text-slate-600 border border-slate-100'} shadow-lg ${folder.shadow} transition-all duration-300`}>
                            <IconComponent size={20} />
                            {completed && (
                              <span className="absolute -top-1 -right-1 w-4 h-4 bg-emerald-400 text-white rounded-full flex items-center justify-center text-[10px] font-bold border-2 border-white shadow-xs">
                                ✓
                              </span>
                            )}
                          </div>
                          <span className="mt-1 text-[10px] font-bold text-slate-700 tracking-tight whitespace-nowrap bg-white/90 backdrop-blur-md px-2.5 py-0.5 rounded-full shadow-md shadow-pink-100/40 border border-pink-100/80">
                            {folder.title}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  {/* 하단 기분 선택 패널 (파스텔 글래스 카드) */}
                  <div className="bg-white/80 backdrop-blur-xl p-4 rounded-[2rem] shadow-xl shadow-purple-100/40 border border-white/80 mt-auto">
                    <div className="flex items-center justify-between mb-2 px-1">
                      <span className="text-xs font-bold text-slate-400">오늘의 기분</span>
                      {todayData.mood && (
                        <span className="text-xs font-bold text-purple-600 bg-purple-50 border border-purple-100 px-3 py-0.5 rounded-full">
                          {MOODS.find(m => m.emoji === todayData.mood)?.label} 선택됨
                        </span>
                      )}
                    </div>
                    <div className="flex justify-between items-center px-2">
                      {MOODS.map(m => (
                        <button 
                          key={m.label}
                          onClick={() => updateCategoryData('mood', m.emoji)}
                          className={`relative p-2 text-2xl transition-all duration-300 rounded-2xl ${
                            todayData.mood === m.emoji 
                              ? 'scale-125 bg-gradient-to-b from-purple-100 to-pink-100 shadow-md border border-purple-200 -translate-y-1' 
                              : 'opacity-50 hover:opacity-100 hover:scale-110'
                          }`}
                          title={m.label}
                        >
                          {m.emoji}
                          {todayData.mood === m.emoji && (
                            <span className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-purple-500 rounded-full" />
                          )}
                        </button>
                      ))}
                    </div>
                  </div>

                </div>
              ) : (
                <div className="flex-1 flex flex-col h-full pb-2">
                  {currentView === 'health' && <HealthView initialData={todayData.health} onSave={(data) => { updateCategoryData('health', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                  {currentView === 'study' && <StudyView initialData={todayData.study} onSave={(data) => { updateCategoryData('study', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                  {currentView === 'reading' && <ReadingView initialData={todayData.reading} onSave={(data) => { updateCategoryData('reading', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                  {currentView === 'exercise' && <ExerciseView initialData={todayData.exercise} onSave={(data) => { updateCategoryData('exercise', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                  {currentView === 'review' && <ReviewView initialData={todayData.review} onSave={(data) => { updateCategoryData('review', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                  {currentView === 'other' && <OtherView initialData={todayData.other} onSave={(data) => { updateCategoryData('other', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                  {currentView === 'youtube' && <YoutubeView initialData={todayData.youtube} onSave={(data) => { updateCategoryData('youtube', data); setCurrentView('main'); }} onBack={() => setCurrentView('main')} />}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
