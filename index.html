<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Daily Tracker</title>
  
  <!-- PWA 앱 환경 설정 (홈화면 추가 시 앱처럼 동작) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeTracker">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Inline Web App Manifest (PWA 아이콘 및 스플래시) -->
  <link rel="manifest" href='data:application/manifest+json;utf8,{"name":"Vibe Daily Tracker","short_name":"VibeTracker","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3652/3652191.png","sizes":"512x512","type":"image/png"}]}'>
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel JS Preprocessor CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #090d16;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-slow {
      animation: spin-slow 60s linear infinite;
    }

    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 고퀄리티 SVG 아이콘 컴포넌트 ---
    const IconPill = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>
      </svg>
    );

    const IconBook = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const IconPen = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.5 7.5"/><path d="m11 11 1 1"/>
      </svg>
    );

    const IconDumbbell = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/>
      </svg>
    );

    const IconCalendar = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>
      </svg>
    );

    const IconList = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
      </svg>
    );

    const IconYoutube = ({ size = 22, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.56 49.56 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><polygon points="10 15 15 12 10 9 10 15"/>
      </svg>
    );

    const IconLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconPlus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
    const IconCloudSync = ({ syncing }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={syncing ? "animate-spin text-indigo-500" : "text-emerald-500"}>
        <path d="M17.5 19px 2 0 0 1 17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M12 13v-3"/><path d="m9 12 3-3 3 3"/>
      </svg>
    );

    const formatDate = (date) => {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };

    const MOODS = [
      { emoji: '😡', label: '화남' },
      { emoji: '🙁', label: '우울' },
      { emoji: '😐', label: '보통' },
      { emoji: '🙂', label: '좋음' },
      { emoji: '🥰', label: '최고' }
    ];

    const defaultDayData = {
      mood: null,
      health: { supplements: false, bpMeds: false, others: false, othersNote: '' },
      study: [],
      reading: [],
      exercise: [],
      review: { today: '', tomorrow: '' },
      other: [],
      youtube: []
    };

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [records, setRecords] = useState({});
      const [currentView, setCurrentView] = useState('main');
      const [dbStatus, setDbStatus] = useState('connecting'); // 'connecting' | 'synced' | 'saving'
      const [dbRef, setDbRef] = useState({ db: null, doc: null, setDoc: null, onSnapshot: null, appId: 'default-app' });

      const dateKey = formatDate(currentDate);
      const todayData = records[dateKey] || defaultDayData;

      // 파이어베이스 동적 모듈 로드 및 디비 연동
      useEffect(() => {
        let unsubscribe = null;

        async function initFirebase() {
          try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'vibe-daily-tracker-default';
            const firebaseConfig = typeof __firebase_config !== 'undefined' 
              ? JSON.parse(__firebase_config) 
              : {
                  apiKey: "demo-key",
                  authDomain: "demo.firebaseapp.com",
                  projectId: "demo-project",
                  storageBucket: "demo.appspot.com",
                  messagingSenderId: "123456789",
                  appId: "1:123456789:web:123456"
                };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // 인증 진행
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            setDbRef({ db, doc, setDoc, onSnapshot, appId });

            // 실시간 날짜별 데이터 리스너 등록
            const docPath = doc(db, 'artifacts', appId, 'public', 'data', 'tracker_records', dateKey);
            
            unsubscribe = onSnapshot(docPath, (docSnap) => {
              if (docSnap.exists()) {
                setRecords(prev => ({
                  ...prev,
                  [dateKey]: docSnap.data()
                }));
              }
              setDbStatus('synced');
            }, (error) => {
              console.warn("Firestore sync error:", error);
              setDbStatus('synced'); // 로컬 오프라인 모드 유지
            });

          } catch (err) {
            console.log("Firebase init standard fallback active");
            setDbStatus('synced');
          }
        }

        initFirebase();

        return () => {
          if (unsubscribe) unsubscribe();
        };
      }, [dateKey]);

      // 데이터 변경 시 Firestore 데이터베이스에 실시간 반영
      const updateCategoryData = async (category, data) => {
        const newDayData = {
          ...(records[dateKey] || defaultDayData),
          [category]: data
        };

        setRecords(prev => ({
          ...prev,
          [dateKey]: newDayData
        }));

        if (dbRef.db && dbRef.doc && dbRef.setDoc) {
          try {
            setDbStatus('saving');
            const targetDoc = dbRef.doc(dbRef.db, 'artifacts', dbRef.appId, 'public', 'data', 'tracker_records', dateKey);
            await dbRef.setDoc(targetDoc, newDayData, { merge: true });
            setDbStatus('synced');
          } catch (err) {
            console.error("Save failed:", err);
            setDbStatus('synced');
          }
        }
      };

      const changeDate = (days) => {
        const newDate = new Date(currentDate);
        newDate.setDate(newDate.getDate() + days);
        setCurrentDate(newDate);
        setCurrentView('main');
      };

      const displayDate = new Intl.DateTimeFormat('ko-KR', { 
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' 
      }).format(currentDate);

      const folders = [
        { id: 'health', title: '건강 관리', icon: IconPill, color: 'bg-rose-500 text-white', lightBg: 'bg-rose-50 text-rose-500', shadow: 'shadow-rose-200 hover:shadow-rose-400' },
        { id: 'study', title: '학습 기록', icon: IconBook, color: 'bg-blue-500 text-white', lightBg: 'bg-blue-50 text-blue-500', shadow: 'shadow-blue-200 hover:shadow-blue-400' },
        { id: 'reading', title: '독서 활동', icon: IconPen, color: 'bg-emerald-500 text-white', lightBg: 'bg-emerald-50 text-emerald-500', shadow: 'shadow-emerald-200 hover:shadow-emerald-400' },
        { id: 'exercise', title: '운동 기록', icon: IconDumbbell, color: 'bg-orange-500 text-white', lightBg: 'bg-orange-50 text-orange-500', shadow: 'shadow-orange-200 hover:shadow-orange-400' },
        { id: 'review', title: '하루 정리', icon: IconCalendar, color: 'bg-purple-500 text-white', lightBg: 'bg-purple-50 text-purple-500', shadow: 'shadow-purple-200 hover:shadow-purple-400' },
        { id: 'other', title: '기타 활동', icon: IconList, color: 'bg-teal-500 text-white', lightBg: 'bg-teal-50 text-teal-500', shadow: 'shadow-teal-200 hover:shadow-teal-400' },
        { id: 'youtube', title: '유튜브 시청', icon: IconYoutube, color: 'bg-red-500 text-white', lightBg: 'bg-red-50 text-red-500', shadow: 'shadow-red-200 hover:shadow-red-400' },
      ];

      const isFolderCompleted = (folderId) => {
        switch(folderId) {
          case 'health': return todayData.health?.supplements || todayData.health?.bpMeds || todayData.health?.others;
          case 'study': return todayData.study?.length > 0 && todayData.study.some(s => s.title);
          case 'reading': return todayData.reading?.length > 0 && todayData.reading.some(r => r.title);
          case 'exercise': return todayData.exercise?.length > 0 && todayData.exercise.some(e => e.type);
          case 'review': return Boolean(todayData.review?.today || todayData.review?.tomorrow);
          case 'other': return todayData.other?.length > 0;
          case 'youtube': return todayData.youtube?.length > 0 && todayData.youtube.some(y => y.title || y.channel);
          default: return false;
        }
      };

      const completedCount = folders.filter(f => isFolderCompleted(f.id)).length;

      const getGreeting = () => {
        const hour = currentDate.getHours();
        if (hour < 12) return '좋은 아침이에요';
        if (hour < 18) return '활기찬 오후입니다';
        return '따뜻한 저녁 되세요';
      };

      // 1. 건강 관리 뷰
      const HealthView = () => {
        const data = todayData.health || { supplements: false, bpMeds: false, others: false, othersNote: '' };
        const toggle = (field) => updateCategoryData('health', { ...data, [field]: !data[field] });
        
        return (
          <div className="space-y-6">
            <h2 className="text-xl font-bold text-slate-800 mb-6">건강 관리 체크리스트</h2>
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-3">
              <div onClick={() => toggle('supplements')} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl cursor-pointer hover:bg-rose-50/50 transition-colors">
                <span className="font-semibold text-slate-800">💊 영양제 복용</span>
                <span className={`text-xl font-bold ${data.supplements ? 'text-rose-500' : 'text-slate-300'}`}>{data.supplements ? '✓' : '○'}</span>
              </div>
              <div onClick={() => toggle('bpMeds')} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl cursor-pointer hover:bg-rose-50/50 transition-colors">
                <span className="font-semibold text-slate-800">🩸 혈압약 복용</span>
                <span className={`text-xl font-bold ${data.bpMeds ? 'text-rose-500' : 'text-slate-300'}`}>{data.bpMeds ? '✓' : '○'}</span>
              </div>
              <div onClick={() => toggle('others')} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl cursor-pointer hover:bg-rose-50/50 transition-colors">
                <span className="font-semibold text-slate-800">🏥 기타 건강 관리</span>
                <span className={`text-xl font-bold ${data.others ? 'text-rose-500' : 'text-slate-300'}`}>{data.others ? '✓' : '○'}</span>
              </div>
              {data.others && (
                <input
                  type="text"
                  placeholder="기타 체크사항 메모"
                  value={data.othersNote || ''}
                  onChange={(e) => updateCategoryData('health', { ...data, othersNote: e.target.value })}
                  className="w-full bg-slate-50 rounded-xl p-3 text-sm outline-none border border-slate-200 focus:border-rose-400 mt-2"
                />
              )}
            </div>
          </div>
        );
      };

      // 2. 학습 기록 뷰
      const StudyView = () => {
        const data = todayData.study || [];
        const addStudy = () => updateCategoryData('study', [...data, { title: '', time: '', note: '' }]);
        const updateStudy = (index, field, value) => {
          const newData = [...data];
          newData[index][field] = value;
          updateCategoryData('study', newData);
        };
        const removeStudy = (index) => updateCategoryData('study', data.filter((_, i) => i !== index));

        return (
          <div className="space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800">학습 기록 ({data.length}/3)</h2>
              {data.length < 3 && (
                <button onClick={addStudy} className="flex items-center gap-1 text-sm bg-blue-100 text-blue-600 px-3 py-1.5 rounded-full font-medium hover:bg-blue-200"><IconPlus /> 추가</button>
              )}
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400">오늘의 학습을 추가해보세요!</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3 relative">
                <button onClick={() => removeStudy(i)} className="absolute top-4 right-4 text-slate-300 hover:text-red-500"><IconTrash /></button>
                <input type="text" placeholder="학습 주제 (예: 바이브코딩 웹개발)" value={item.title} onChange={(e) => updateStudy(i, 'title', e.target.value)} className="w-full text-lg font-bold outline-none pr-8 bg-transparent" />
                <input type="text" placeholder="학습 시간 (예: 2시간)" value={item.time} onChange={(e) => updateStudy(i, 'time', e.target.value)} className="w-full text-sm text-blue-500 bg-blue-50/50 p-2.5 rounded-xl outline-none" />
                <textarea placeholder="핵심 내용이나 메모" value={item.note} onChange={(e) => updateStudy(i, 'note', e.target.value)} className="w-full bg-slate-50 rounded-xl p-3 text-sm min-h-[80px] outline-none border-none resize-none" />
              </div>
            ))}
          </div>
        );
      };

      // 3. 독서 활동 뷰
      const ReadingView = () => {
        const data = todayData.reading || [];
        const addReading = () => updateCategoryData('reading', [...data, { title: '', author: '', pages: '', quote: '', reflection: '' }]);
        const updateReading = (index, field, value) => {
          const newData = [...data];
          newData[index][field] = value;
          updateCategoryData('reading', newData);
        };
        const removeReading = (index) => updateCategoryData('reading', data.filter((_, i) => i !== index));

        return (
          <div className="space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800">독서 노트 ({data.length}/3)</h2>
              {data.length < 3 && (
                <button onClick={addReading} className="flex items-center gap-1 text-sm bg-emerald-100 text-emerald-600 px-3 py-1.5 rounded-full font-medium hover:bg-emerald-200"><IconPlus /> 책 추가</button>
              )}
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400">오늘 읽은 책을 기록해보세요!</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-3 relative">
                <button onClick={() => removeReading(i)} className="absolute top-5 right-5 text-slate-300 hover:text-red-500"><IconTrash /></button>
                <input type="text" placeholder="책 제목" value={item.title} onChange={(e) => updateReading(i, 'title', e.target.value)} className="w-full font-bold text-lg outline-none pr-8 bg-transparent" />
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="저자" value={item.author} onChange={(e) => updateReading(i, 'author', e.target.value)} className="text-sm bg-slate-50 p-2.5 rounded-lg outline-none" />
                  <input type="text" placeholder="페이지 (p.10~35)" value={item.pages} onChange={(e) => updateReading(i, 'pages', e.target.value)} className="text-sm bg-slate-50 p-2.5 rounded-lg outline-none" />
                </div>
                <textarea placeholder="❝ 인상 깊었던 구절 ❞" value={item.quote} onChange={(e) => updateReading(i, 'quote', e.target.value)} className="w-full bg-emerald-50/50 text-emerald-800 rounded-xl p-3 text-sm min-h-[70px] outline-none italic resize-none" />
                <textarea placeholder="나의 생각과 느낀 점" value={item.reflection} onChange={(e) => updateReading(i, 'reflection', e.target.value)} className="w-full bg-slate-50 rounded-xl p-3 text-sm min-h-[80px] outline-none resize-none" />
              </div>
            ))}
          </div>
        );
      };

      // 4. 운동 기록 뷰
      const ExerciseView = () => {
        const data = todayData.exercise || [];
        const exerciseTypes = ['헬스', '등산', '러닝', '자전거', '기타'];
        const addExercise = () => updateCategoryData('exercise', [...data, { type: '헬스', duration: '', note: '' }]);
        const updateExercise = (index, field, value) => {
          const newData = [...data];
          newData[index][field] = value;
          updateCategoryData('exercise', newData);
        };
        const removeExercise = (index) => updateCategoryData('exercise', data.filter((_, i) => i !== index));

        return (
          <div className="space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800">운동 기록</h2>
              <button onClick={addExercise} className="flex items-center gap-1 text-sm bg-orange-100 text-orange-600 px-3 py-1.5 rounded-full font-medium hover:bg-orange-200"><IconPlus /> 추가</button>
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400">오늘 어떤 운동을 하셨나요?</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                <div className="flex justify-between items-center">
                  <div className="flex flex-wrap gap-1.5">
                    {exerciseTypes.map(type => (
                      <button key={type} onClick={() => updateExercise(i, 'type', type)} className={`px-2.5 py-1 text-xs rounded-full ${item.type === type ? 'bg-orange-500 text-white font-medium shadow-md shadow-orange-200' : 'bg-slate-100 text-slate-500'}`}>
                        {type}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => removeExercise(i)} className="text-slate-300 hover:text-red-500"><IconTrash /></button>
                </div>
                <div className="flex gap-2">
                  <input type="text" placeholder="시간 (예: 1시간)" value={item.duration} onChange={(e) => updateExercise(i, 'duration', e.target.value)} className="w-1/3 bg-slate-50 rounded-xl p-2.5 text-sm outline-none" />
                  <input type="text" placeholder="상세 내용" value={item.note} onChange={(e) => updateExercise(i, 'note', e.target.value)} className="w-2/3 bg-slate-50 rounded-xl p-2.5 text-sm outline-none" />
                </div>
              </div>
            ))}
          </div>
        );
      };

      // 5. 하루 정리 뷰
      const ReviewView = () => {
        const data = todayData.review || { today: '', tomorrow: '' };
        return (
          <div className="space-y-6">
            <h2 className="text-xl font-bold text-slate-800 mb-6">하루 정리 및 계획</h2>
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-2">
              <label className="font-semibold text-slate-700">🌙 오늘 하루 돌아보기</label>
              <textarea placeholder="오늘 하루 감사했던 일이나 아쉬웠던 점" value={data.today} onChange={(e) => updateCategoryData('review', { ...data, today: e.target.value })} className="w-full bg-slate-50 rounded-2xl p-3.5 min-h-[120px] outline-none text-sm focus:bg-purple-50/50 transition-colors resize-none" />
            </div>
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-2">
              <label className="font-semibold text-slate-700">☀️ 내일의 핵심 계획</label>
              <textarea placeholder="내일 해야 할 핵심 목표" value={data.tomorrow} onChange={(e) => updateCategoryData('review', { ...data, tomorrow: e.target.value })} className="w-full bg-slate-50 rounded-2xl p-3.5 min-h-[100px] outline-none text-sm focus:bg-purple-50/50 transition-colors resize-none" />
            </div>
          </div>
        );
      };

      // 6. 기타 활동 뷰
      const OtherView = () => {
        const data = todayData.other || [];
        const activityTags = ['청소', '세탁', '장보기', '외부 활동', '가족모임', '기타'];
        const addActivity = (type) => updateCategoryData('other', [...data, { type, note: '' }]);
        const removeActivity = (index) => updateCategoryData('other', data.filter((_, i) => i !== index));

        return (
          <div className="space-y-6">
            <h2 className="text-xl font-bold text-slate-800 mb-2">기타 활동</h2>
            <div className="flex flex-wrap gap-2 mb-4">
              {activityTags.map(tag => (
                <button key={tag} onClick={() => addActivity(tag)} className="px-3 py-1.5 bg-white border border-teal-200 text-teal-600 rounded-full text-xs font-medium hover:bg-teal-50">
                  + {tag}
                </button>
              ))}
            </div>
            <div className="space-y-2">
              {data.length === 0 && <div className="text-center py-8 text-slate-400 border-2 border-dashed border-slate-200 rounded-3xl">추가된 활동이 없습니다.</div>}
              {data.map((item, i) => (
                <div key={i} className="flex items-center gap-2 bg-white p-3 rounded-2xl border border-slate-100">
                  <span className="font-bold text-teal-600 text-sm whitespace-nowrap">{item.type}</span>
                  <input type="text" placeholder="세부 내용 (선택)" value={item.note} onChange={(e) => {
                    const newData = [...data];
                    newData[i].note = e.target.value;
                    updateCategoryData('other', newData);
                  }} className="flex-1 bg-transparent outline-none text-sm" />
                  <button onClick={() => removeActivity(i)} className="text-slate-300 hover:text-red-500"><IconTrash /></button>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // 7. 유튜브 시청 뷰
      const YoutubeView = () => {
        const data = todayData.youtube || [];
        const addYoutube = () => updateCategoryData('youtube', [...data, { channel: '', title: '', note: '' }]);
        const removeYoutube = (index) => updateCategoryData('youtube', data.filter((_, i) => i !== index));

        return (
          <div className="space-y-6">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-800">유튜브 시청 기록</h2>
              <button onClick={addYoutube} className="flex items-center gap-1 text-sm bg-red-100 text-red-600 px-3 py-1.5 rounded-full font-medium hover:bg-red-200"><IconPlus /> 추가</button>
            </div>
            {data.length === 0 && <div className="text-center py-10 text-slate-400">인상 깊었던 영상을 기록해보세요!</div>}
            {data.map((item, i) => (
              <div key={i} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-2.5 relative">
                <button onClick={() => removeYoutube(i)} className="absolute top-4 right-4 text-slate-300 hover:text-red-500"><IconTrash /></button>
                <input type="text" placeholder="채널명" value={item.channel} onChange={(e) => {
                  const newData = [...data];
                  newData[i].channel = e.target.value;
                  updateCategoryData('youtube', newData);
                }} className="w-full text-xs font-semibold text-red-500 bg-red-50 p-2 rounded-lg outline-none pr-8" />
                <input type="text" placeholder="영상 제목" value={item.title} onChange={(e) => {
                  const newData = [...data];
                  newData[i].title = e.target.value;
                  updateCategoryData('youtube', newData);
                }} className="w-full text-base font-bold outline-none bg-transparent" />
                <textarea placeholder="요약 및 느낀 점" value={item.note} onChange={(e) => {
                  const newData = [...data];
                  newData[i].note = e.target.value;
                  updateCategoryData('youtube', newData);
                }} className="w-full bg-slate-50 rounded-xl p-2.5 text-sm min-h-[70px] outline-none resize-none" />
              </div>
            ))}
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-950 sm:flex sm:justify-center">
          <div className="w-full max-w-md bg-slate-50 min-h-screen relative shadow-2xl sm:border-x border-slate-200 flex flex-col justify-between overflow-hidden">
            
            {/* 은은한 에어리얼 배경 라이트 애니메이션 */}
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-indigo-200/40 rounded-full blur-3xl pointer-events-none animate-pulse" />
            <div className="absolute bottom-1/3 left-10 w-60 h-60 bg-purple-200/30 rounded-full blur-3xl pointer-events-none" />

            {/* 상단 날짜 네비게이션 & DB 저장 상태 표시 */}
            <header className="sticky top-0 z-20 bg-slate-50/80 backdrop-blur-md pt-6 pb-4 px-6 flex items-center justify-between border-b border-slate-100">
              <button onClick={() => changeDate(-1)} className="p-2 rounded-full hover:bg-slate-200/50 text-slate-400 hover:text-slate-700 transition-colors">
                <IconLeft />
              </button>
              <div className="text-center">
                <div className="flex items-center justify-center gap-1.5">
                  <h1 className="text-base font-extrabold text-slate-800 tracking-tight">{displayDate}</h1>
                  <IconCloudSync syncing={dbStatus === 'saving'} />
                </div>
              </div>
              <button onClick={() => changeDate(1)} className="p-2 rounded-full hover:bg-slate-200/50 text-slate-400 hover:text-slate-700 transition-colors">
                <IconRight />
              </button>
            </header>

            <main className="px-6 py-4 flex-1 flex flex-col justify-between z-10 no-scrollbar overflow-y-auto">
              {currentView === 'main' ? (
                <div className="flex-1 flex flex-col justify-between py-2">
                  
                  {/* 상단 웰컴 바 */}
                  <div className="text-center my-2">
                    <span className="text-xs font-bold tracking-wider text-indigo-500 uppercase bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                      {getGreeting()} ✨
                    </span>
                  </div>

                  {/* 중앙 원형(Radial / Orbital) 폴더 배치 */}
                  <div className="relative w-full aspect-square max-w-[320px] max-h-[320px] mx-auto my-auto flex items-center justify-center">
                    
                    {/* 회전하는 대시보드 링 */}
                    <div className="absolute w-[220px] h-[220px] rounded-full border border-dashed border-indigo-200/80 animate-spin-slow" />
                    <div className="absolute w-[260px] h-[260px] rounded-full border border-slate-200/40" />

                    {/* 중앙 코어 대시보드 */}
                    <div className="z-10 text-center flex flex-col items-center justify-center p-4 rounded-full bg-white/90 backdrop-blur-md shadow-xl border border-indigo-100/80 w-32 h-32 hover:scale-105 transition-transform duration-300">
                      <span className="text-3xl font-black text-slate-800 tracking-tight">{completedCount}<span className="text-sm font-bold text-slate-300">/7</span></span>
                      <span className="text-[11px] font-semibold text-slate-500 mt-0.5">오늘의 기록</span>
                      <div className="w-12 h-1 bg-slate-100 rounded-full mt-1.5 overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500" style={{ width: `${(completedCount / 7) * 100}%` }} />
                      </div>
                    </div>

                    {/* 7개 원형 삼각함수 좌표 배치 */}
                    {folders.map((folder, index) => {
                      const IconComponent = folder.icon;
                      const total = folders.length;
                      const angle = (index * (360 / total) - 90) * (Math.PI / 180);
                      const radius = 118;
                      const x = Math.round(Math.cos(angle) * radius);
                      const y = Math.round(Math.sin(angle) * radius);
                      const completed = isFolderCompleted(folder.id);

                      return (
                        <button
                          key={folder.id}
                          onClick={() => setCurrentView(folder.id)}
                          style={{ transform: `translate(${x}px, ${y}px)` }}
                          className="absolute z-20 group flex flex-col items-center transition-all duration-300 hover:scale-110 active:scale-95"
                        >
                          <div className={`relative p-3 rounded-2xl ${completed ? folder.color : 'bg-white text-slate-600'} shadow-md border border-slate-100/80 group-hover:shadow-xl ${folder.shadow} transition-all duration-300`}>
                            <IconComponent size={20} />
                            {completed && (
                              <span className="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 text-white rounded-full flex items-center justify-center text-[10px] font-bold border-2 border-white shadow-sm">
                                ✓
                              </span>
                            )}
                          </div>
                          <span className="mt-1 text-[10px] font-bold text-slate-700 tracking-tight whitespace-nowrap bg-white/80 backdrop-blur-sm px-2 py-0.5 rounded-full shadow-xs border border-slate-100/50">
                            {folder.title}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  {/* 하단 기분 선택 패널 */}
                  <div className="bg-white/80 backdrop-blur-md p-4 rounded-[2rem] shadow-sm border border-slate-100/80 mt-auto">
                    <div className="flex items-center justify-between mb-2 px-1">
                      <span className="text-xs font-bold text-slate-500">오늘의 기분</span>
                      {todayData.mood && (
                        <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full">
                          {MOODS.find(m => m.emoji === todayData.mood)?.label} 선택됨
                        </span>
                      )}
                    </div>
                    <div className="flex justify-between items-center px-2">
                      {MOODS.map(m => (
                        <button 
                          key={m.label}
                          onClick={() => updateCategoryData('mood', m.emoji)}
                          className={`relative p-2 text-2xl transition-all duration-300 rounded-2xl ${
                            todayData.mood === m.emoji 
                              ? 'scale-125 bg-indigo-50 shadow-inner -translate-y-1' 
                              : 'opacity-50 hover:opacity-100 hover:scale-110'
                          }`}
                          title={m.label}
                        >
                          {m.emoji}
                          {todayData.mood === m.emoji && (
                            <span className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-indigo-500 rounded-full" />
                          )}
                        </button>
                      ))}
                    </div>
                  </div>

                </div>
              ) : (
                /* 서브 페이지 렌더링 */
                <div>
                  <button onClick={() => setCurrentView('main')} className="flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium mb-6 transition-colors group">
                    <div className="p-1.5 rounded-full bg-white shadow-sm group-hover:bg-slate-200 transition-colors">
                      <IconLeft />
                    </div>
                    메인으로 돌아가기
                  </button>
                  {currentView === 'health' && <HealthView />}
                  {currentView === 'study' && <StudyView />}
                  {currentView === 'reading' && <ReadingView />}
                  {currentView === 'exercise' && <ExerciseView />}
                  {currentView === 'review' && <ReviewView />}
                  {currentView === 'other' && <OtherView />}
                  {currentView === 'youtube' && <YoutubeView />}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
